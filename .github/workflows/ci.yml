name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install lint tools
        run: pip install -r requirements-lint.txt
      - name: Run Ruff linter
        run: ruff check fisherman tests plugins/fisherman-redmine
      - name: Check Ruff formatting
        run: ruff format --check fisherman tests plugins/fisherman-redmine

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install lint tools
        run: pip install -r requirements-lint.txt
      - name: Run mypy (strict)
        run: mypy

  pydoclint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install lint tools
        run: pip install -r requirements-lint.txt
      - name: Check docstrings match signatures
        run: pydoclint fisherman plugins/fisherman-redmine/fisherman_redmine

  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
        include:
          - python: '3.14'
            coverage: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run specs
        if: matrix.coverage != 'true'
        run: python -m unittest discover -s tests -t . -v
      - name: Run specs with coverage
        if: matrix.coverage == 'true'
        run: |
          pip install -r requirements-lint.txt
          coverage run -m unittest discover -s tests -t . -v
          coverage report

  specs-redmine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.9'
          - '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Fisherman and the Redmine plug-in
        run: pip install . ./plugins/fisherman-redmine
      - name: Run specs
        working-directory: plugins/fisherman-redmine
        run: python -m unittest discover -s tests -t . -v
      - name: Check coverage
        if: matrix.python == '3.14'
        working-directory: plugins/fisherman-redmine
        run: |
          pip install -r ../../requirements-lint.txt
          coverage run -m unittest discover -s tests -t .
          coverage report

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - ruff
      - mypy
      - pydoclint
      - specs
      - specs-redmine
    steps:
      - name: Check all jobs passed
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI checks passed successfully"
