name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install lint tools
        run: pip install -r requirements-lint.txt
      - name: Run Ruff linter
        run: ruff check fisherman tests plugins/fisherman-redmine
      - name: Check Ruff formatting
        run: ruff format --check fisherman tests plugins/fisherman-redmine

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install lint tools
        run: pip install -r requirements-lint.txt
      - name: Run mypy (strict)
        run: mypy

  pydoclint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install lint tools
        run: pip install -r requirements-lint.txt
      - name: Check docstrings match signatures
        run: pydoclint fisherman plugins/fisherman-redmine/fisherman_redmine

  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
        include:
          - python: '3.14'
            coverage: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run specs
        if: matrix.coverage != 'true'
        run: python -m unittest discover -s tests -t . -v
      - name: Run specs with coverage
        if: matrix.coverage == 'true'
        run: |
          pip install -r requirements-lint.txt
          coverage run -m unittest discover -s tests -t . -v
          coverage report

  specs-redmine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.9'
          - '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Fisherman and the Redmine plug-in
        run: pip install . ./plugins/fisherman-redmine
      - name: Run specs
        working-directory: plugins/fisherman-redmine
        run: python -m unittest discover -s tests -t . -v
      - name: Check coverage
        if: matrix.python == '3.14'
        working-directory: plugins/fisherman-redmine
        run: |
          pip install -r ../../requirements-lint.txt
          coverage run -m unittest discover -s tests -t .
          coverage report

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run hadolint
        uses: docker://hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d # v2.15.1
        with:
          args: hadolint --failure-threshold style Dockerfile
      - name: Build the image
        run: docker build -t fisherman:ci .
      - name: Smoke test the image
        run: |
          docker run --rm --read-only --cap-drop ALL fisherman:ci --version
          docker run --rm --entrypoint python fisherman:ci -c \
            "from fisherman import plugins; assert plugins.resolve('sources', 'redmine').__name__ == 'RedmineSource'"
          test "$(docker run --rm --entrypoint id fisherman:ci -u)" = "10001"

  action-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check SHA pins
        run: |
          if grep -E -r "uses: .*/.*@(v[0-9]+|main|master)($|[[:space:]])" --include="*.yml" --include="*.yaml" .github/workflows/ | grep -v "#"; then
            echo "::error::Actions should use SHA pins, not tags or branch names"
            exit 1
          fi

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - ruff
      - mypy
      - pydoclint
      - specs
      - specs-redmine
      - docker
      - action-pins
      - actionlint
    steps:
      - name: Check all jobs passed
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI checks passed!"
