[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fisherman"
version = "0.1.0"
description = "Catches prompt injection and authority spoofing in what AI agents read and write. Runs local LLMs only and checks claims against the record."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
fisherman = "fisherman.cli:main"

[tool.setuptools.packages.find]
include = ["fisherman*"]

[tool.setuptools.package-data]
fisherman = ["prompts/*.txt"]
